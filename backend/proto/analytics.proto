syntax = "proto3";

package prepapig.analytics;

message AnalyticsResponse {
  repeated Batch batches = 1;
  repeated FeedRecord feed_records = 2;
  repeated VaccinationRecord vaccination_records = 3;
  repeated Expense expenses = 4;
  repeated FeedStock feed_stock = 5;
  repeated VaccineStock vaccine_stock = 6;
}

message Batch {
  string id = 1;
  string batch_code = 2;
  int32 pig_count = 3;
  string breed = 4;
  double start_weight = 5;
  double current_weight = 6;
  string sale_price_per_kg = 7;
  string date_acquired = 8;
  string status = 9;
  string created_at = 10;
}

message FeedRecord {
  string id = 1;
  string batch_id = 2;
  string feed_type = 3;
  double quantity_kg = 4;
  string feeding_date = 5;
  string feeding_time = 6;
  string notes = 7;
  string created_at = 8;
}

message VaccinationRecord {
  string id = 1;
  string batch_id = 2;
  string vaccine_name = 3;
  string vaccination_date = 4;
  string next_due_date = 5;
  string administered_by = 6;
  string dosage = 7;
  string notes = 8;
  string status = 9;
  string created_at = 10;
}

message Expense {
  string id = 1;
  string batch_id = 2;
  string expense_type = 3;
  double amount = 4;
  string expense_date = 5;
  string description = 6;
  string created_at = 7;
}

message FeedStock {
  string feed_type = 1;
  double unit_price = 2;
  double stock_quantity = 3;
}

message VaccineStock {
  string vaccine_name = 1;
  double price_per_dose = 2;
  double stock_quantity = 3;
}
