name: Scheduled Reminders

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  feed-reminders:
    name: Feed Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Feed Reminders
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${API_BASE_URL}/api/cron/feed-reminders"

  vaccination-reminders:
    name: Vaccination Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vaccination Reminders
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${API_BASE_URL}/api/cron/vaccination-reminders"

  # Alternative: Single job that runs both (uses only 1 cron slot on Vercel Hobby)
